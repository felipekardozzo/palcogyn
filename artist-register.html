
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Artista | PalcoGyn</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#101827;color:white;margin:0;padding:20px}
.container{max-width:650px;margin:25px auto;background:#1d293b;padding:25px;border-radius:14px}
h1{color:#38bdf8;text-align:center}
p{text-align:center;color:#cbd5e1}
label{display:block;margin-top:15px;font-weight:bold}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border-radius:7px;border:1px solid #475569;background:#0f172a;color:white}
button{width:100%;padding:14px;margin-top:22px;background:#0284c7;color:white;border:0;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
#mensagem{margin-top:15px;text-align:center;white-space:pre-wrap}
</style>
</head>
<body>
<div class="container">
<h1>PALCOGYN</h1>
<p>TALENTOS • EVENTOS • CONEXÕES</p>
<h2>Cadastro de artista</h2>
<form id="artistForm">
<label>Nome artístico</label>
<input id="artist_name" required>

<label>Tipo de artista</label>
<select id="artist_type" required>
<option value="">Selecione</option>
<option>Cantor(a)</option>
<option>Músico(a)</option>
<option>Banda</option>
<option>DJ</option>
</select>

<label>Tipo de apresentação</label>
<input id="performance_type" placeholder="Ex.: Solo, dupla, banda completa">

<label>Estilos musicais</label>
<input id="music_styles" placeholder="Ex.: Sertanejo, pagode, forró">

<label>Biografia / Apresentação</label>
<textarea id="bio" rows="4" placeholder="Conte um pouco sobre sua trajetória"></textarea>

<label>Cidade</label>
<input id="city" required>

<label>Estado (UF)</label>
<input id="state" maxlength="2" placeholder="GO" required>

<label>Cachê por apresentação (R$)</label>
<input id="performance_fee" type="number" min="0" step="0.01" required>

<label>Equipamentos e Instrumentos</label>
<textarea id="sound_setup" rows="4" placeholder="Descreva os equipamentos que você possui e informe se precisa de algum equipamento adicional para suas apresentações."></textarea>

<button type="submit">Salvar cadastro</button>
</form>

<hr style="margin:30px 0;border:1px solid #475569;">

<h2 style="color:#38bdf8;">Gerenciar meu material artístico</h2>
<p>Atualize sua foto de perfil e publique fotos e vídeos dos seus trabalhos.</p>

<h3>Minha foto de perfil</h3>
<div id="fotoPerfil"></div>
<input type="file" id="arquivoFoto" accept="image/*">
<button type="button" id="enviarFoto">Atualizar foto de perfil</button>
<div id="mensagemFoto"></div>

<hr style="margin:25px 0;border:1px solid #475569;">

<h3>Meu portfólio</h3>
<p>Mostre seus trabalhos e apresentações aos contratantes.</p>

<input type="file" id="arquivoPortfolio" accept="image/*,video/mp4">
<button type="button" id="enviarPortfolio">Publicar foto ou vídeo</button>
<div id="mensagemPortfolio"></div>

<div id="listaPortfolio"></div>

<div id="mensagem"></div>
</div>

<script>
const SUPABASE_URL = "https://nocwkiobwjpuygsbnyhn.supabase.co";
const SUPABASE_KEY = "sb_publishable_L0JjrfD0Zia0zjQ8opWnXA_Qzxwgp-p";
const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const formulario = document.getElementById("artistForm");
const mensagem = document.getElementById("mensagem");
const botao = formulario.querySelector('button[type="submit"]');

async function carregarCadastro(){
  try{
    const {data:{user},error:authError}=await db.auth.getUser();

    if(authError) throw authError;
    if(!user) throw new Error("Faça login antes de acessar seu cadastro.");

    const {data:perfil,error}=await db
      .from("artist_profiles")
      .select("artist_name,artist_type,performance_type,music_styles,bio,city,state,performance_fee,sound_setup")
      .eq("user_id",user.id)
      .maybeSingle();

    if(error) throw error;

    if(perfil){
      document.getElementById("artist_name").value=perfil.artist_name||"";
      document.getElementById("artist_type").value=perfil.artist_type||"";
      document.getElementById("performance_type").value=perfil.performance_type||"";
      document.getElementById("music_styles").value=(perfil.music_styles||[]).join(", ");
      document.getElementById("bio").value=perfil.bio||"";
      document.getElementById("city").value=perfil.city||"";
      document.getElementById("state").value=perfil.state||"";
      document.getElementById("performance_fee").value=perfil.performance_fee??"";
      document.getElementById("sound_setup").value=perfil.sound_setup||"";

      botao.textContent="Atualizar cadastro";
      mensagem.textContent="Seu cadastro foi carregado. Você pode editar seus dados.";
     
    }else{
      botao.textContent="Salvar cadastro";
      mensagem.textContent="Preencha seus dados para criar seu perfil artístico.";
    }

  }catch(error){
    mensagem.textContent="Erro ao carregar cadastro: "+error.message;
  }
}

formulario.addEventListener("submit",async function(e){
  e.preventDefault();
  mensagem.textContent="Salvando cadastro...";

  try{
    const {data:{user},error:authError}=await db.auth.getUser();

    if(authError) throw authError;
    if(!user) throw new Error("Faça login antes de cadastrar seu perfil artístico.");

    const musicStyles=document.getElementById("music_styles").value
      .split(",").map(x=>x.trim()).filter(Boolean);

    const perfil={
      user_id:user.id,
      artist_name:document.getElementById("artist_name").value.trim(),
      artist_type:document.getElementById("artist_type").value,
      performance_type:document.getElementById("performance_type").value.trim(),
      music_styles:musicStyles,
      bio:document.getElementById("bio").value.trim(),
      city:document.getElementById("city").value.trim(),
      state:document.getElementById("state").value.trim().toUpperCase(),
      performance_fee:Number(document.getElementById("performance_fee").value),
      sound_setup:document.getElementById("sound_setup").value.trim()
    };

    const {error}=await db
      .from("artist_profiles")
      .upsert(perfil,{onConflict:"user_id"});

    if(error) throw error;

    botao.textContent="Atualizar cadastro";
    mensagem.textContent="Cadastro artístico atualizado com sucesso!";
setTimeout(()=>{
  window.location.href="artist-dashboard.html";
},1500);
  }catch(error){
    mensagem.textContent="Não foi possível salvar: "+error.message;
  }
});

async function iniciarMidias(){
  const {data:{user},error}=await db.auth.getUser();

  if(error || !user) return;

  const fotoPerfil=document.getElementById("fotoPerfil");
  const avisoFoto=document.getElementById("mensagemFoto");
  const avisoPortfolio=document.getElementById("mensagemPortfolio");
  const lista=document.getElementById("listaPortfolio");

  // CARREGAR FOTO DE PERFIL
  const {data:perfil}=await db
    .from("profiles")
    .select("foto_url")
    .eq("id",user.id)
    .maybeSingle();

  if(perfil?.foto_url){
    const {data:foto}=await db.storage
      .from("artist-media")
      .createSignedUrl(perfil.foto_url,3600);

    if(foto?.signedUrl){
      fotoPerfil.innerHTML=
        '<img src="'+foto.signedUrl+'" style="width:150px;height:150px;object-fit:cover;border-radius:50%;">';
    }
  }

  // ATUALIZAR FOTO DE PERFIL
  document.getElementById("enviarFoto").addEventListener("click",async()=>{
    const arquivo=document.getElementById("arquivoFoto").files[0];

    if(!arquivo){
      avisoFoto.textContent="Selecione uma foto.";
      return;
    }

    if(!arquivo.type.startsWith("image/") || arquivo.size>5*1024*1024){
      avisoFoto.textContent="Envie uma imagem de até 5 MB.";
      return;
    }

    avisoFoto.textContent="Enviando foto...";

    const fotoAntiga=perfil?.foto_url;
    const nome=Date.now()+"_"+arquivo.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const caminho=user.id+"/profile/"+nome;

    const {error:envio}=await db.storage
      .from("artist-media")
      .upload(caminho,arquivo);

    if(envio){
      avisoFoto.textContent="Erro ao enviar: "+envio.message;
      return;
    }

    const {error:atualizacao}=await db
      .from("profiles")
      .update({foto_url:caminho})
      .eq("id",user.id);

    if(atualizacao){
      await db.storage.from("artist-media").remove([caminho]);
      avisoFoto.textContent="Erro ao salvar: "+atualizacao.message;
      return;
    }

    if(fotoAntiga && fotoAntiga!==caminho){
      await db.storage.from("artist-media").remove([fotoAntiga]);
    }

    perfil.foto_url=caminho;

    const {data:foto}=await db.storage
      .from("artist-media")
      .createSignedUrl(caminho,3600);

    if(foto?.signedUrl){
      fotoPerfil.innerHTML=
        '<img src="'+foto.signedUrl+'" style="width:150px;height:150px;object-fit:cover;border-radius:50%;">';
    }

    document.getElementById("arquivoFoto").value="";
    avisoFoto.textContent="Foto de perfil atualizada com sucesso!";
  });

  // CARREGAR PORTFÓLIO
  async function carregarPortfolio(){
    lista.textContent="Carregando publicações...";

    const {data:midias,error}=await db
      .from("artist_portfolio")
      .select("id,media_type,media_url,is_featured,created_at")
      .eq("artist_id",user.id)
      .order("created_at",{ascending:false});

    if(error){
      lista.textContent="Erro ao carregar: "+error.message;
      return;
    }

    lista.innerHTML="";

    if(!midias || midias.length===0){
      lista.textContent="Você ainda não publicou fotos ou vídeos.";
      return;
    }

    for(const item of midias){
      const {data:arquivo}=await db.storage
        .from("artist-media")
        .createSignedUrl(item.media_url,3600);

      if(!arquivo?.signedUrl) continue;

      const bloco=document.createElement("div");
      bloco.style.margin="15px 0";
      bloco.style.padding="12px";
      bloco.style.background="#334155";
      bloco.style.borderRadius="10px";

      if(item.media_type==="video"){
        bloco.innerHTML='<video controls style="width:100%;max-height:300px;border-radius:8px;"></video>';
        bloco.querySelector("video").src=arquivo.signedUrl;
      }else{
        bloco.innerHTML='<img style="width:100%;max-height:300px;object-fit:contain;border-radius:8px;">';
        bloco.querySelector("img").src=arquivo.signedUrl;
      }

      if(item.is_featured){
        const destaque=document.createElement("p");
        destaque.textContent="Publicação em destaque";
        bloco.appendChild(destaque);
      }

      lista.appendChild(bloco);
    }
  }

  await carregarPortfolio();

  // PUBLICAR FOTO OU VÍDEO
  document.getElementById("enviarPortfolio").addEventListener("click",async()=>{
    const arquivo=document.getElementById("arquivoPortfolio").files[0];

    if(!arquivo){
      avisoPortfolio.textContent="Selecione uma foto ou vídeo.";
      return;
    }

    const ehFoto=arquivo.type.startsWith("image/");
    const ehVideo=arquivo.type==="video/mp4";

    if(!ehFoto && !ehVideo){
      avisoPortfolio.textContent="Envie uma imagem ou vídeo MP4.";
      return;
    }

    if(ehFoto && arquivo.size>5*1024*1024){
      avisoPortfolio.textContent="A foto deve ter no máximo 5 MB.";
      return;
    }

    if(ehVideo && arquivo.size>25*1024*1024){
      avisoPortfolio.textContent="O vídeo deve ter no máximo 25 MB.";
      return;
    }

    avisoPortfolio.textContent="Enviando publicação...";

    const nome=Date.now()+"_"+arquivo.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const caminho=user.id+"/portfolio/"+nome;

    const {error:envio}=await db.storage
      .from("artist-media")
      .upload(caminho,arquivo);

    if(envio){
      avisoPortfolio.textContent="Erro no envio: "+envio.message;
      return;
    }

    const {error:cadastro}=await db
      .from("artist_portfolio")
      .insert({
        artist_id:user.id,
        media_type:ehVideo?"video":"performance_photo",
        media_url:caminho,
        is_featured:false
      });

    if(cadastro){
      await db.storage.from("artist-media").remove([caminho]);
      avisoPortfolio.textContent="Erro ao cadastrar: "+cadastro.message;
      return;
    }

    document.getElementById("arquivoPortfolio").value="";
    avisoPortfolio.textContent="Publicação enviada com sucesso!";
    await carregarPortfolio();
  });
}

iniciarMidias();
carregarCadastro();
</script>
</body>
</html>
