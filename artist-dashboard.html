
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espaço do Artista | PalcoGyn</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff}
header{background:#102c50;padding:22px;text-align:center}
header h1{margin:0;color:#38bdf8}
header p{margin:7px 0 0;color:#bae6fd;font-size:13px}
.container{max-width:750px;margin:25px auto;padding:20px}
.card{background:#1e293b;padding:22px;border-radius:14px;margin-bottom:18px}
h2{color:#38bdf8;margin-top:0}
.info{color:#cbd5e1;line-height:1.8}
button,.link{display:block;width:100%;padding:14px;margin-top:12px;border:0;border-radius:8px;background:#0284c7;color:white;font-weight:bold;text-align:center;text-decoration:none;cursor:pointer}
.secondary{background:#334155}
#mensagem{color:#fbbf24;white-space:pre-wrap}
footer{text-align:center;color:#94a3b8;padding:20px;font-size:12px}
</style>
</head>

<body>
<header>
<h1>PALCOGYN</h1>
<p>TALENTOS • EVENTOS • CONEXÕES</p>
</header>

<div class="container">
<div class="card">
<h2>Meu espaço artístico</h2>
<p id="m">Verificando sua conta...</p>
<div id="conteudo"></div>
</div>
</div>

<footer>PalcoGyn — Descubra novos talentos.</footer>

<script>
const SUPABASE_URL = "https://nocwkiobwjpuygsbnyhn.supabase.co";
const SUPABASE_KEY = "sb_publishable_L0JjrfD0Zia0zjQ8opWnXA_Qzxwgp-p";
const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function iniciar(){
  const m=document.getElementById("m");
  const conteudo=document.getElementById("conteudo");

  try{
    const {data:{user},error:authError}=await db.auth.getUser();

    if(authError) throw authError;

    if(!user){
  m.textContent="Você precisa entrar na sua conta.";
  conteudo.HTML='<a class="link" href="index.html">Ir para o login</a>';
  return;
}

    const {data:perfil,error:perfilError}=await db
      .from("profiles")
      .select("nome,tipo,cidade,whatsapp,foto_url")  
      .eq("id",user.id)
      .maybeSingle();

    if(perfilError) throw perfilError;

    const {data:artista,error:artistaError}=await db
      .from("artist_profiles")
      .select("id_palcogyn,artist_name,artist_type,performance_type,music_styles,city,state,performance_fee")      
      .eq("user_id",user.id)
      .maybeSingle();

    if(artistaError) throw artistaError;

    m.textContent="Você está conectado!";

    let html="";
    html+='<h3>Minha foto de perfil</h3>';
    html+='<div id="fotoPerfil"></div>';
    html+='<input type="file" id="arquivoFoto" accept="image/*">';
    html+='<button id="enviarFoto">Enviar foto</button>';
    html+='<p id="mensagemFoto"></p>';
    html+='<hr>';
    html+='<h3>Meu portfólio</h3>';
    html+='<p>Publique fotos e vídeos dos seus trabalhos.</p>';
    html+='<input type="file" id="arquivoPortfolio" accept="image/*,video/mp4">';
    html+='<button id="enviarPortfolio">Publicar no portfólio</button>';
    html+='<p id="mensagemPortfolio"></p>';
    html+='<div id="listaPortfolio"></div>';

    html+='<p class="info"><strong>Responsável:</strong> '+escapar(perfil?.nome||"Não informado")+'</p>';
    
    if(artista){
      html+='<p class="info"><strong> artístico:</strong> '+escapar(artista.artist_name||"Não informado")+'</p>';
      html+='<p class="info"><strong>ID PALCOGYN:</strong> '+escapar(artista.id_palcogyn||"Não disponível")+'</p>';
      html+='<p class="info"><strong>Categoria:</strong> '+escapar(artista.artist_type||"Não informado")+'</p>';
      html+='<p class="info"><strong>Apresentação:</strong> '+escapar(artista.performance_type||"Não informado")+'</p>';
      html+='<p class="info"><strong>Estilos:</strong> '+escapar((artista.music_styles||[]).join(", ")||"Não informado")+'</p>';
      html+='<p class="info"><strong>Local:</strong> '+escapar(artista.city||"")+' - '+escapar(artista.state||"")+'</p>';
      html+='<p class="info"><strong>Cachê informado:</strong> R$ '+Number(artista.performance_fee||0).toLocaleString("pt-BR",{minimumFractionDigits:2})+'</p>';
      html+='<a class="link" href="artist-register.html">Atualizar meu cadastro artístico</a>';
    }else{
      html+='<p class="info">Seu perfil artístico ainda não foi preenchido. Complete seu cadastro para começar a apresentar seus talentos no PalcoGyn.</p>';
      html+='<a class="link" href="artist-register.html">Completar meu cadastro artístico</a>';
    }

    html+='<button class="secondary" id="sair">Sair da conta</button>';
    conteudo.innerHTML=html;
    async function carregarPortfolio(){
  const lista=document.getElementById("listaPortfolio");
  lista.innerHTML="Carregando publicações...";

  const {data:midias,error}=await db
    .from("artist_portfolio")
    .select("id,artist_id,media_type,media_url,is_featured,created_at")
    .eq("artist_id",user.id)
    .order("created_at",{ascending:false});

  if(error){
    lista.textContent="Erro ao carregar portfólio: "+error.message;
    return;
  }

  lista.innerHTML="";

  if(!midias || midias.length===0){
    lista.textContent="Você ainda não publicou fotos ou vídeos.";
    return;
  }

  for(const item of midias){
    const {data:arquivo,error:erroArquivo}=await db.storage
      .from("artist-media")
      .createSignedUrl(item.media_url,3600);

    if(erroArquivo || !arquivo?.signedUrl) continue;

    const bloco=document.createElement("div");
    bloco.style.margin="15px 0";
    bloco.style.padding="12px";
    bloco.style.background="#334155";
    bloco.style.borderRadius="10px";

    if(item.media_type==="video"){
      bloco.innerHTML='<video controls style="width:100%;max-height:300px;border-radius:8px;"></video>';
      bloco.querySelector("video").src=arquivo.signedUrl;
    }else{
      bloco.innerHTML='<img style="width:100%;max-height:300px;object-fit:contain;border-radius:8px;">';
      bloco.querySelector("img").src=arquivo.signedUrl;
    }

    if(item.is_featured){
      const destaque=document.createElement("p");
      destaque.textContent="Publicação em destaque";
      bloco.appendChild(destaque);
    }

    lista.appendChild(bloco);
  }
}

carregarPortfolio();
    if(perfil?.foto_url){
  const {data:foto,error:erroFoto}=await db.storage
    .from("artist-media")
    .createSignedUrl(perfil.foto_url,3600);

  if(erroFoto){
    document.getElementById("fotoPerfil").textContent=
      "Erro ao carregar foto: "+erroFoto.message;
  }else if(foto?.signedUrl){
    document.getElementById("fotoPerfil").innerHTML=
      '<img src="'+foto.signedUrl+'" style="width:150px;height:150px;object-fit:cover;border-radius:50%;">';
  }
}

    document.getElementById("enviarFoto").addEventListener("click",async()=>{
  const arquivo=document.getElementById("arquivoFoto").files[0];
  const aviso=document.getElementById("mensagemFoto");

  if(!arquivo){
    aviso.textContent="Selecione uma foto primeiro.";
    return;
  }

  if(!arquivo.type.startsWith("image/")){
    aviso.textContent="Selecione um arquivo de imagem.";
    return;
  }

  if(arquivo.size>5*1024*1024){
    aviso.textContent="A foto deve ter no máximo 5 MB.";
    return;
  }

  aviso.textContent="Enviando foto...";

  const fotoAntiga=perfil?.foto_url;
  const nomeArquivo=Date.now()+"_"+arquivo.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const caminho=user.id+"/profile/"+nomeArquivo;

  const {error:erroEnvio}=await db.storage
    .from("artist-media")
    .upload(caminho,arquivo);

  if(erroEnvio){
    aviso.textContent="Erro ao enviar: "+erroEnvio.message;
    return;
  }

  const {error:erroAtualizacao}=await db
    .from("profiles")
    .update({foto_url:caminho})
    .eq("id",user.id);

  if(erroAtualizacao){
    aviso.textContent="Erro ao salvar a foto: "+erroAtualizacao.message;
    return;
  }
if(fotoAntiga && fotoAntiga !== caminho){
  const {error:erroExclusao}=await db.storage
    .from("artist-media")
    .remove([fotoAntiga]);

  if(erroExclusao){
  aviso.textContent="Nova foto salva, mas não foi possível excluir a antiga: "+erroExclusao.message;
  return;
}
}
  const {data:foto}=await db.storage
    .from("artist-media")
    .createSignedUrl(caminho,3600);

  if(foto){
    document.getElementById("fotoPerfil").innerHTML=
      '<img src="'+foto.signedUrl+'" style="width:150px;height:150px;object-fit:cover;border-radius:50%;">';
  }

  aviso.textContent="Foto de perfil atualizada com sucesso!";
});
    document.getElementById("sair").addEventListener("click",async()=>{
      await db.auth.signOut();
      window.location.href="index.html";
    });

  }catch(error){
    mensagem.textContent="Erro ao carregar seu espaço: "+error.message;
  }
}

function escapar(valor){
  return String(valor).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

iniciar();
</script>
</body>
</html>
