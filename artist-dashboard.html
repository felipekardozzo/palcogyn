
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espaço do Artista | PalcoGyn</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#0b1424;
 color:#fff;
}

header{
 background:linear-gradient(135deg,#102c50,#075985);
 padding:25px 15px;
 text-align:center;
 border-bottom:1px solid #25638b;
}

header h1{
 margin:0;
 color:#38bdf8;
 letter-spacing:2px;
}

header p{
 color:#bae6fd;
 font-size:13px;
 margin-bottom:0;
}

.container{
 max-width:950px;
 margin:30px auto;
 padding:15px;
}

.card{
 background:#172438;
 :1px solid #293c55;
 padding:25px;
 border-radius:16px;
 margin-bottom:20px;
 box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.artist-hero{
 display:flex;
 align-items:center;
 gap:25px;
 flex-wrap:wrap;
}

.avatar{
 width:145px;
 height:145px;
 border-radius:50%;
 object-fit:cover;
 border:4px solid #38bdf8;
 background:#263b54;
}

.artist-name{
 font-size:28px;
 margin:0 0 8px;
 color:#fff;
}

.artist-id{
 color:#38bdf8;
 font-size:13px;
 font-weight:bold;
}

.artist-category{
 color:#cbd5e1;
 margin-top:10px;
}

h2{
 color:#38bdf8;
 margin-top:0;
}

h3{
 color:#bae6fd;
}

.info{
 color:#cbd5e1;
 line-height:1.6;
 margin:0;
}

.details-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
 gap:14px;
 margin-top:20px;
}

.detail{
 background:#0f1d30;
 border:1px solid #30445e;
 padding:16px;
 border-radius:10px;
}

.detail strong{
 display:block;
 color:#38bdf8;
 font-size:12px;
 margin-bottom:7px;
 text-transform:uppercase;
}

.detail span{
 color:#fff;
 line-height:1.5;
}

.bio{
 color:#cbd5e1;
 line-height:1.8;
 white-space:pre-wrap;
}

.portfolio-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:16px;
 margin-top:20px;
}

.portfolio-item{
 background:#0f1d30;
 border:1px solid #30445e;
 border-radius:12px;
 overflow:hidden;
 position:relative;
}

.portfolio-item img,
.portfolio-item video{
 display:block;
 width:100%;
 height:230px;
 object-fit:cover;
 background:#000;
}

.portfolio-item video{
 object-fit:contain;
}

.destaque{
 color:#fbbf24;
 font-size:12px;
 font-weight:bold;
 padding:10px;
}

button,.link{
 display:block;
 width:100%;
 padding:14px;
 margin-top:12px;
 border:0;
 border-radius:9px;
 background:#0284c7;
 color:white;
 font-weight:bold;
 text-align:center;
 text-decoration:none;
 cursor:pointer;
}

button:hover,.link:hover{
 background:#0369a1;
}

.secondary{
 background:#334155;
}

#mensagem{
 color:#fbbf24;
 white-space:pre-wrap;
}

footer{
 text-align:center;
 color:#94a3b8;
 padding:25px;
 font-size:12px;
}
/* GALERIA PROFISSIONAL */

.portfolio-item{
 cursor:pointer;
 transition:transform .25s ease,box-shadow .25s ease;
}

.portfolio-item:hover{
 transform:translateY(-5px);
 box-shadow:0 12px 28px rgba(0,0,0,.4);
}

.portfolio-item img{
 transition:transform .35s ease;
}

.portfolio-item:hover img{
 transform:scale(1.04);
}

/* VISUALIZADOR AMPLIADO */

.lightbox{
 display:none;
 position:fixed;
 inset:0;
 z-index:9999;
 background:rgba(2,6,23,.96);
 align-items:center;
 justify-content:center;
 padding:25px;
}

.lightbox.ativo{
 display:flex;
}

.lightbox-conteudo{
 max-width:1000px;
 max-height:90vh;
 width:100%;
 display:flex;
 align-items:center;
 justify-content:center;
}

.lightbox-conteudo img,
.lightbox-conteudo video{
 max-width:100%;
 max-height:85vh;
 object-fit:contain;
 border-radius:12px;
}

.lightbox-fechar{
 position:absolute;
 top:18px;
 right:25px;
 width:48px;
 height:48px;
 border:0;
 border-radius:50%;
 background:#0284c7;
 color:white;
 font-size:28px;
 cursor:pointer;
}
@media(max-width:600px){
 .card{padding:18px}
 .artist-hero{
  flex-direction:column;
  text-align:center;
 }
 .artist-name{font-size:23px}
 .avatar{width:130px;height:130px}
}
</style>
</head>

<body>

<header>
<h1>PALCOGYN</h1>
<p>TALENTOS • EVENTOS • CONEXÕES</p>
</header>

<div class="container">

<div class="card">
<p id="m">Verificando sua conta...</p>
<div id="conteudo"></div>
</div>

</div>
<div id="lightbox" class="lightbox">
 <button class="lightbox-fechar" id="fecharLightbox">×</button>
 <div id="lightboxConteudo" class="lightbox-conteudo"></div>
</div>
<footer>PalcoGyn — Descubra novos talentos.</footer>

<script>
const SUPABASE_URL = "https://nocwkiobwjpuygsbnyhn.supabase.co";
const SUPABASE_KEY = "sb_publishable_L0JjrfD0Zia0zjQ8opWnXA_Qzxwgp-p";
const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function escapar(valor){
 return String(valor).replace(/[&<>"']/g,function(c){
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c];
 });
}

async function iniciar(){

 const m=document.getElementById("m");
 const conteudo=document.getElementById("conteudo");

 try{

  const {data:{user},error:authError}=await db.auth.getUser();

  if(authError) throw authError;

  if(!user){
   m.textContent="Você precisa entrar na sua conta.";
   conteudo.innerHTML='<a class="link" href="index.html">Ir para o login</a>';
   return;
  }

  const {data:perfil,error:perfilError}=await db
   .from("profiles")
   .select("nome,tipo,cidade,whatsapp,foto_url")
   .eq("id",user.id)
   .maybeSingle();

  if(perfilError) throw perfilError;

  const {data:artista,error:artistaError}=await db
   .from("artist_profiles")
   .select("id_palcogyn,artist_name,artist_type,performance_type,music_styles,city,state,performance_fee,bio,presentation_video_url")   .eq("user_id",user.id)
   .maybeSingle();

  if(artistaError) throw artistaError;

  m.textContent="Seu espaço artístico";

  if(!artista){

   conteudo.innerHTML=
    '<p class="info">Seu perfil artístico ainda não foi preenchido.</p>'+
    '<a class="link" href="artist-register.html">Completar meu cadastro artístico</a>'+
    '<button class="secondary" id="sair">Sair da conta</button>';

  }else{

   const nome=artista.artist_name||"Artista";
   const estilos=(artista.music_styles||[]).join(", ")||"Não informado";

   conteudo.innerHTML=`

    <div class="artist-hero">

     <img id="fotoPerfil" class="avatar"
      src=""
      alt="Foto do artista">

     <div>
      <h2 class="artist-name">${escapar(nome)}</h2>

      <div class="artist-id">
       ID PALCOGYN: ${escapar(artista.id_palcogyn||"Não disponível")}
      </div>

      <p class="artist-category">
       ${escapar(artista.artist_type||"Artista")}
       ${artista.performance_type?" • "+escapar(artista.performance_type):""}
      </p>
     </div>

        </div>
     <hr style="border-color:#30445e;margin:25px 0">

    <h2>Solicitações de contratação</h2>

     <p class="info">
  Confira os eventos para os quais você foi convidado.
     </p>

     <div id="listaContratacoes">
    <p class="info">Carregando solicitações...</p>
    </div>
    <div id="videoApresentacaoArea" style="display:none;margin-top:25px;">

     <hr style="border-color:#30445e;margin:25px 0">

     <h2>Vídeo de apresentação</h2>

     <p class="info">Conheça um pouco mais do trabalho deste artista.</p>

     <video id="videoApresentacao"
      controls
      playsinline
      preload="metadata"
      style="width:100%;max-height:450px;background:#000;border-radius:12px;">
     </video>

    </div>

    <hr style="border-color:#30445e;margin:25px 0">

    <h2>Sobre o artista</h2>

    <div class="details-grid">

     <div class="detail">
      <strong>Estilos musicais</strong>
      <span>${escapar(estilos)}</span>
     </div>

     <div class="detail">
      <strong>Localização</strong>
      <span>${escapar(artista.city||"Não informado")} - ${escapar(artista.state||"")}</span>
     </div>

     <div class="detail">
      <strong>Cachê informado</strong>
      <span>R$ ${Number(artista.performance_fee||0).toLocaleString("pt-BR",{minimumFractionDigits:2})}</span>
     </div>

     <div class="detail">
      <strong>Responsável pelo cadastro</strong>
      <span>${escapar(perfil?.nome||"Não informado")}</span>
     </div>

    </div>

    <div id="biografiaArea" style="margin-top:25px"></div>

    <hr style="border-color:#30445e;margin:25px 0">

    <h2>Portfólio artístico</h2>

    <p class="info">
     Conheça os trabalhos e apresentações deste artista.
    </p>

    <div id="listaPortfolio" class="portfolio-grid"></div>

    <a class="link" href="artist-register.html">
     Atualizar meu cadastro artístico
    </a>

    <button class="secondary" id="sair">
     Sair da conta
    </button>
   `;

   // FOTO DE PERFIL

   const fotoElemento=document.getElementById("fotoPerfil");

   if(perfil?.foto_url){

    const {data:foto,error:erroFoto}=await db.storage
     .from("artist-media")
     .createSignedUrl(perfil.foto_url,3600);

    if(!erroFoto && foto?.signedUrl){
     fotoElemento.src=foto.signedUrl;
    }

   }
    // VÍDEO DE APRESENTAÇÃO

   if(artista.presentation_video_url){

    const {data:videoArquivo,error:erroVideo}=await db.storage
     .from("artist-media")
     .createSignedUrl(artista.presentation_video_url,3600);

    if(!erroVideo && videoArquivo?.signedUrl){

     const areaVideo=document.getElementById("videoApresentacaoArea");
     const playerVideo=document.getElementById("videoApresentacao");

     playerVideo.src=videoArquivo.signedUrl;
     areaVideo.style.display="block";

    }

   }
   
   // BIOGRAFIA

   const biografiaArea=document.getElementById("biografiaArea");

   if(artista.bio){

    biografiaArea.innerHTML=
     '<h3>Apresentação</h3>'+
     '<p class="bio">'+escapar(artista.bio)+'</p>';

   }

   // CARREGAR PORTFÓLIO

   async function carregarPortfolio(){

    const lista=document.getElementById("listaPortfolio");

    lista.innerHTML="";

    const {data:midias,error}=await db
     .from("artist_portfolio")
     .select("id,artist_id,media_type,media_url,is_featured,created_at")
     .eq("artist_id",user.id)
     .order("created_at",{ascending:false});

    if(error){
     lista.textContent="Erro ao carregar portfólio: "+error.message;
     return;
    }

    if(!midias || midias.length===0){
     lista.innerHTML=
      '<p class="info">Este artista ainda não publicou fotos ou vídeos.</p>';
     return;
    }

    for(const item of midias){

     const {data:arquivo,error:erroArquivo}=await db.storage
      .from("artist-media")
      .createSignedUrl(item.media_url,3600);

     if(erroArquivo || !arquivo?.signedUrl) continue;

     const bloco=document.createElement("div");
     bloco.className="portfolio-item";

     if(item.media_type==="video"){

      const video=document.createElement("video");
      video.controls=true;
      video.preload="metadata";
      video.src=arquivo.signedUrl;
      bloco.appendChild(video);

     }else{

      const imagem=document.createElement("img");
      imagem.src=arquivo.signedUrl;
      imagem.alt="Trabalho artístico de "+nome;
      imagem.loading="lazy";
      bloco.appendChild(imagem);

     }

     if(item.is_featured){

      const destaque=document.createElement("div");
      destaque.className="destaque";
      destaque.textContent="★ PUBLICAÇÃO EM DESTAQUE";
      bloco.appendChild(destaque);

     }

     lista.appendChild(bloco);
     bloco.addEventListener("click",function(){

 const lightbox=document.getElementById("lightbox");
 const area=document.getElementById("lightboxConteudo");

 area.innerHTML="";

 if(item.media_type==="video"){

  const video=document.createElement("video");
  video.src=arquivo.signedUrl;
  video.controls=true;
  video.autoplay=true;
  video.playsInline=true;
  area.appendChild(video);

 }else{

  const imagem=document.createElement("img");
  imagem.src=arquivo.signedUrl;
  imagem.alt="Imagem ampliada do portfólio";
  area.appendChild(imagem);

 }

 lightbox.classList.add("ativo");

});

    }

   }

   await carregarPortfolio();

  }

  // SAIR DA CONTA

  document.getElementById("sair").addEventListener("click",async()=>{
   await db.auth.signOut();
   window.location.href="index.html";
  });

 }catch(error){

  m.textContent="Erro ao carregar seu espaço: "+error.message;

 }

}
// FECHAR VISUALIZADOR

document.getElementById("fecharLightbox").addEventListener("click",function(){

 const lightbox=document.getElementById("lightbox");
 const area=document.getElementById("lightboxConteudo");

 lightbox.classList.remove("ativo");
 area.innerHTML="";

});

document.getElementById("lightbox").addEventListener("click",function(event){

 if(event.target===this){

  this.classList.remove("ativo");
  document.getElementById("lightboxConteudo").innerHTML="";

 }

});

document.addEventListener("keydown",function(event){

 if(event.key==="Escape"){

  document.getElementById("lightbox").classList.remove("ativo");
  document.getElementById("lightboxConteudo").innerHTML="";

 }

});
iniciar();
</script>

</body>
</html>
